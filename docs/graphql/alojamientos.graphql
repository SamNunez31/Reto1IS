# Esquema federado GraphQL CONCEPTUAL (Reto 3 - Apollo Federation). No se implementa en el Reto 1.
# El subgrafo de Alojamientos expone la entidad Alojamiento (clave = código entero público)
# y dos consultas agregadas que hoy salen de las vistas v_alojamiento_resumen y v_ventas_por_ciudad.

type Alojamiento @key(fields: "id") {
  id: ID!
  nombre: String!
  tipo: String!
  ciudad: String!
  provincia: String!
  latitud: Float!
  longitud: Float!
  estrellas: Int
  precioDesde: Float
  calificacion: Float
  numResenas: Int!
  portada: String
}

# Agregado 1: resumen de oferta y calificación por ciudad (para un buscador combinado)
type ResumenCiudad {
  ciudad: String!
  provincia: String!
  alojamientos: Int!
  precioPromedioNoche: Float
  calificacionPromedio: Float
}

# Agregado 2: ventas por ciudad (panel del ADMIN / BI)
type VentasCiudad {
  ciudad: String!
  provincia: String!
  reservas: Int!
  noches: Int!
  volumenUSD: Float!
}

extend type Query {
  alojamiento(id: ID!): Alojamiento
  alojamientos(ciudad: String, estrellasMin: Int, precioMax: Float): [Alojamiento!]!
  resumenPorCiudad(provincia: String): [ResumenCiudad!]!
  ventasPorCiudad(desde: String, hasta: String): [VentasCiudad!]!
}
