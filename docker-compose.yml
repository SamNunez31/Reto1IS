
# Postgres local para desarrollo. En producción se usa Supabase (ver docs/DOCUMENTO_TECNICO.md).
# Los scripts de database/ se ejecutan en orden alfabético solo la primera vez (volumen vacío).
# Para recrear la BD desde cero: docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: booking_db_container
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./database/02_datos_demo.sql:/docker-entrypoint-initdb.d/02_datos_demo.sql:ro
      - ./database/03_integracion.sql:/docker-entrypoint-initdb.d/03_integracion.sql:ro
      - ./database/datos_catalogo_extra.sql:/docker-entrypoint-initdb.d/04_datos_catalogo_extra.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking_db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
